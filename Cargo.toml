[package]
name = "transactions-check"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio   = { version = "1", features = ["full"] }
serde   = { version = "1.0", features = ["derive"] }
uuid    = { version = "1.3", features = ["v4",  "serde"] }
chrono  = { version = "0.4"}
csv = "1.4.0"

[dependencies.sea-orm]
version = "2.0.0-rc"
features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "debug-print",
    "entity-registry",
    "schema-sync",
    "uuid",
    "chrono",
]
